<!DOCTYPE html>
<html lang="en-CA">
    <head>
        <title>error 404</title>

        <style>
            .error {
                position: absolute;
                top: 35%;
                left: 50%;
                transform: translate(-50%, -50%);

                h1 {
                    color: oklch(0.7176 0.1839 304.77);
                    font-size: 12rem;
                    margin-bottom: 0;
                    max-width: fit-content;
                    margin-left: auto;
                    margin-right: auto;
                    text-align: center;
                }

                a {
                    color: oklch(0.472 0.232 300.92);
                }
                .error-description {
                    margin-top: -10%;
                }

                p {
                    margin-top: 0;
                    max-width: fit-content;
                    margin-left: auto;
                    margin-right: auto;
                    text-align: center;
                    font-size: 1rem
                }
            }

            body {
                background: #1e1e2e;
            }

            ::selection {
            background: oklch(0.483 0.137 319.619);
            }

            .space-grotesk-single-header {
                font-family: "Space Grotesk", sans-serif;
                font-optical-sizing: auto;
                font-weight: 425;
                font-style: normal;
                color: oklch(0.751 0.0396 273.93);
            }

            .space-grotesk-normal{
                font-family: "Space Grotesk", sans-serif;
                font-optical-sizing: auto;
                font-weight: 350;
                font-style: normal;
                color: oklch(0.751 0.0396 273.93);
            }

            .explain-tooltip {
                position: relative;
                display: inline-block;
                border-bottom: 1px dotted oklch(0.751 0.0396 273.93); /* Add dots under the hoverable text */
                cursor: pointer;
                max-width: fit-content;
                margin-left: auto;
                margin-right: auto;
                text-align: center;
            }
            .explain-tooltip-text {
                visibility: hidden; /* Hidden by default */
                width: 300px;
                top: 110%;
                left: 50%;
                margin-left: -150px;
                background-color: oklch(0.687 0.037 274.725);
                color: #1e1e2e;
                text-align: center;
                padding: 5px 0;
                border-radius: 6px;
                position: absolute;
                cursor: auto;
                /*z-index: 1; !* Ensure tooltip is displayed above content *!*/
            }

            .explain-tooltip:hover .explain-tooltip-text {
                visibility: visible;
            }
        </style>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="error space-grotesk-normal">
            <h1 class="space-grotesk-single-header">404</h1>
            <p class="error-description">there is no route associated with this domain</p>
            <p class="error explain-tooltip">what's this?
                <span class="explain-tooltip-text">this is a fallback page that is served any time a request hits
                    <a href="https://thirtyseventh.xyz">my</a> servers without a route in traefik for it
                </span>
            </p>
        </div>
    </body>
</html>
